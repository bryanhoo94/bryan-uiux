<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bryan-uiux 图鉴</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* 布局：顶部标题 + 吸顶跳转条；每组一张自适应网格，会动的在前，静态的在后。配色沿用 demo/index.html */
  :root{
    --bg:#F8FAFC; --card:#FFFFFF; --stage:#F1F5F9; --ink:#0F172A; --ink-2:#334155; --muted:#5B6B80;
    --line:#E2E8F0; --line-2:#CBD5E1; --accent:#FF5A3C; --accent-ink:#C2410C; --accent-soft:#FFE9E4;
    --ok:#15803D; --ok-soft:#DCFCE7; --err:#D92D20; --err-soft:#FEE4E2; --warn:#B45309;
    --shadow:0 1px 2px rgba(15,23,42,.06), 0 8px 24px -12px rgba(15,23,42,.22);
    --ease-out:cubic-bezier(0.23, 1, 0.32, 1); --ease-in-out:cubic-bezier(0.77, 0, 0.175, 1); --ease-drawer:cubic-bezier(0.32, 0.72, 0, 1);
    --sans:ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    --mono:ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    font-synthesis-weight:none;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0B1018; --card:#121926; --stage:#0E1520; --ink:#E7ECF3; --ink-2:#C3CCD9; --muted:#93A1B5;
    --line:#1F2A3A; --line-2:#2C3A4E; --accent:#FF6A4D; --accent-ink:#FF8A70; --accent-soft:#3A1E18;
    --ok:#34D399; --ok-soft:#0F2E24; --err:#F87171; --err-soft:#3A1717; --warn:#F5B544;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7); color-scheme:dark; } }
  :root[data-theme="dark"]{
    --bg:#0B1018; --card:#121926; --stage:#0E1520; --ink:#E7ECF3; --ink-2:#C3CCD9; --muted:#93A1B5;
    --line:#1F2A3A; --line-2:#2C3A4E; --accent:#FF6A4D; --accent-ink:#FF8A70; --accent-soft:#3A1E18;
    --ok:#34D399; --ok-soft:#0F2E24; --err:#F87171; --err-soft:#3A1717; --warn:#F5B544;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7); color-scheme:dark; }

  *{ box-sizing:border-box; }
  html{ scroll-padding-top:72px; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:14px/1.55 var(--sans); -webkit-font-smoothing:antialiased;
    padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg); }
  button, input{ font:inherit; color:inherit; }
  :focus-visible{ outline:2px solid transparent; outline-offset:2px; box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
  h1, h2, h3{ text-wrap:balance; margin:0; }
  p{ text-wrap:pretty; }

  .top{ max-width:1240px; margin:0 auto; padding-block:40px 18px; display:grid; gap:8px; }
  .top h1{ font-size:28px; letter-spacing:-0.01em; }
  .top p{ margin:0; color:var(--muted); font-size:15px; max-width:64ch; }
  .count{ font-variant-numeric:tabular-nums; color:var(--ink-2); }

  .jump{ position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--bg); border-bottom:1px solid var(--line); margin:0 auto; max-width:1240px; }
  .jump-in{ display:flex; gap:6px; overflow-x:auto; padding-block:10px; scrollbar-width:none; }
  .jump-in::-webkit-scrollbar{ display:none; }
  .jump a{ flex:none; font-size:13px; color:var(--ink-2); text-decoration:none; border:1px solid var(--line); background:var(--card); border-radius:999px; padding:5px 12px; white-space:nowrap; }
  @media (hover:hover) and (pointer:fine){ .jump a:hover{ border-color:var(--line-2); color:var(--ink); } }

  main{ max-width:1240px; margin:0 auto; padding-bottom:72px; }
  section.grp{ padding-top:36px; display:grid; gap:14px; }
  .grp > header{ display:grid; gap:4px; }
  .grp h2{ font-size:20px; }
  .grp .note{ margin:0; color:var(--muted); font-size:14px; max-width:70ch; }
  .sub{ display:grid; gap:12px; padding-top:10px; }
  .sub h3{ font-size:14px; color:var(--ink-2); font-weight:600; }
  .grid{ display:grid; gap:16px; grid-template-columns:repeat(auto-fill, minmax(min(100%, 272px), 1fr)); }

  .item{ background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; min-width:0; }
  .item.hit{ box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
  .stage{ height:212px; background:var(--stage); position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .meta{ padding:12px 14px 14px; display:grid; gap:4px; min-width:0; }
  .name{ display:flex; align-items:baseline; gap:8px; min-width:0; }
  .name h3{ font-size:15px; font-weight:600; }
  .code{ flex:none; font:12px/1.5 var(--mono); color:var(--ink-2); background:var(--stage); border-radius:6px; padding:1px 6px; text-decoration:none; }
  .meta p{ margin:0; font-size:13px; color:var(--muted); }
  .acts{ display:flex; align-items:center; gap:10px; margin-top:6px; flex-wrap:wrap; }
  .play{ min-height:32px; padding:0 12px; border-radius:8px; border:1px solid var(--line-2); background:var(--card); cursor:pointer; font-size:13px; display:inline-flex; align-items:center; gap:6px; }
  .play svg{ width:12px; height:12px; position:relative; top:0.06em; }
  @media (hover:hover) and (pointer:fine){ .play:hover{ border-color:var(--ink-2); } }
  @media (pointer:coarse){ .play{ min-height:44px; padding:0 16px; } }
  .acts .hint{ font-size:12px; color:var(--muted); }
  .ic{ width:1em; height:1em; vertical-align:-0.125em; flex:none; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .foot{ max-width:1240px; margin:0 auto; padding-block:8px 48px; color:var(--muted); font-size:13px; }
  .foot p{ margin:0; max-width:70ch; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20h-5.5v-5.5h-5V20H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>

  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-search-f" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="currentColor" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 19.5s-7.5-4.4-7.5-10A4.2 4.2 0 0 1 12 7a4.2 4.2 0 0 1 7.5 2.5c0 5.6-7.5 10-7.5 10z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-heart-f" viewBox="0 0 24 24"><path d="M12 19.5s-7.5-4.4-7.5-10A4.2 4.2 0 0 1 12 7a4.2 4.2 0 0 1 7.5 2.5c0 5.6-7.5 10-7.5 10z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 20c.8-3.7 3.8-5.8 7.5-5.8s6.7 2.1 7.5 5.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-user-f" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8" fill="currentColor"/><path d="M4.5 20c.8-3.7 3.8-5.8 7.5-5.8s6.7 2.1 7.5 5.8z" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5 15V6.5A1.5 1.5 0 0 1 6.5 5H15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<header class="top">
  <h1>bryan-uiux 图鉴</h1>
  <p>建议卡上的每个编号都在这里，地址后面加 <code>#编号</code> 就直接跳到那一格，例如 <code>#G3</code>、<code>#K1</code>、<code>#card6</code>。会动的那些点「播放」，或者直接上手拖。</p>
  <p class="count" id="count"></p>
</header>
<nav class="jump" aria-label="跳到某一组"><div class="jump-in" id="jump"></div></nav>
<main id="main"></main>
<footer class="foot"><p>小样里的时长、曲线、spring 都照 <code>references/core/params.md</code>。系统开了「减少动态效果」时，小样不会自己播，停在最后的样子，点「播放」才动。</p></footer>

<script>
/* 公用：spring、曲线、拖动、速度、手势常量。全部数值来自 references/core/params.md */
window.GL = (() => {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const PRESET = { ui:{ d:0.4, b:0 }, gesture:{ d:0.5, b:0.2 }, pop:{ d:0.4, b:0.3 } };

  /* 一个能随时换目标、保留速度的 spring。速度单位：每秒 */
  class Spring {
    constructor(value, { preset = 'ui', eps = 0.05, onUpdate = () => {}, onRest = null } = {}) {
      this.x = value; this.v = 0; this.target = value; this.eps = eps; this.onUpdate = onUpdate; this.onRest = onRest; this.raf = 0; this.use(preset);
    }
    use(p) { const { d, b } = PRESET[p]; this.z = 1 - b; this.w = 2 * Math.PI / d; return this; }
    to(target, velocity) { this.target = target; if (velocity !== undefined) this.v = velocity; this.run(); return this; }
    jump(value) { this.stop(); this.x = this.target = value; this.v = 0; this.onUpdate(value); return this; }
    stop() { cancelAnimationFrame(this.raf); this.raf = 0; }
    run() {
      if (this.raf) return;
      let last = performance.now();
      const step = (t) => {
        const dt = Math.min((t - last) / 1000, 1 / 30); last = t;
        const n = Math.max(1, Math.ceil(dt * 240)), h = dt / n;
        for (let i = 0; i < n; i++) { const a = -this.w * this.w * (this.x - this.target) - 2 * this.z * this.w * this.v; this.v += a * h; this.x += this.v * h; }
        const rest = Math.abs(this.x - this.target) < this.eps && Math.abs(this.v) < this.eps * 10;
        if (rest) { this.x = this.target; this.v = 0; }
        this.onUpdate(this.x);
        if (rest) { this.raf = 0; this.onRest && this.onRest(); } else this.raf = requestAnimationFrame(step);
      };
      this.raf = requestAnimationFrame(step);
    }
  }

  /* cubic-bezier 求值，给数字补间用 */
  const bezier = (x1, y1, x2, y2) => (x) => {
    if (x <= 0) return 0; if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) {
      const cx = 3 * x1 * t * (1 - t) ** 2 + 3 * x2 * t * t * (1 - t) + t ** 3 - x;
      const dx = 3 * x1 * (1 - t) ** 2 + 6 * (x2 - x1) * t * (1 - t) + 3 * (1 - x2) * t * t;
      if (Math.abs(cx) < 1e-5 || !dx) break; t -= cx / dx; t = Math.min(Math.max(t, 0), 1);
    }
    return 3 * y1 * t * (1 - t) ** 2 + 3 * y2 * t * t * (1 - t) + t ** 3;
  };
  const EASE = { out:bezier(0.23, 1, 0.32, 1), inOut:bezier(0.77, 0, 0.175, 1), drawer:bezier(0.32, 0.72, 0, 1) };
  const CSS = { out:'cubic-bezier(0.23, 1, 0.32, 1)', inOut:'cubic-bezier(0.77, 0, 0.175, 1)', drawer:'cubic-bezier(0.32, 0.72, 0, 1)' };
  const tween = (ms, ease, fn) => new Promise((done) => {
    const t0 = performance.now();
    const step = (t) => { const p = Math.min((t - t0) / ms, 1); fn(ease(p)); p < 1 ? requestAnimationFrame(step) : done(); };
    requestAnimationFrame(step);
  });

  /* 每个小样一个「播放序列」，新的一次开始，旧的自动作废 */
  const seq = () => { let id = 0; return {
    begin() { const my = ++id; return { alive:() => my === id, sleep:(ms) => new Promise((r) => setTimeout(() => r(my === id), ms)) }; },
    cancel() { id++; } }; };

  /* 拖动：按下、移动、松手，带速度（px/ms，取最近 80ms 的平均） */
  const drag = (el, { down, move, up, delay = 0, axis = null }) => {
    let s = null;
    const vel = () => { const a = s.pts[0], b = s.pts[s.pts.length - 1]; const dt = b.t - a.t || 1; return { vx:(b.x - a.x) / dt, vy:(b.y - a.y) / dt }; };
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      s = { id:e.pointerId, x0:e.clientX, y0:e.clientY, t0:performance.now(), pts:[{ x:e.clientX, y:e.clientY, t:performance.now() }], live:!delay || e.pointerType !== 'touch', lock:null };
      if (!s.live) s.timer = setTimeout(() => { if (s) { s.live = true; down && down(e, s); } }, delay);
      el.setPointerCapture(e.pointerId);
      if (s.live && down && down(e, s) === false) s = null;
    });
    el.addEventListener('pointermove', (e) => {
      if (!s || e.pointerId !== s.id) return;
      const t = performance.now(); s.pts.push({ x:e.clientX, y:e.clientY, t }); while (s.pts.length > 2 && t - s.pts[0].t > 80) s.pts.shift();
      if (!s.live) { if (Math.hypot(e.clientX - s.x0, e.clientY - s.y0) > 10) { clearTimeout(s.timer); s = null; } return; }
      move && move(e, e.clientX - s.x0, e.clientY - s.y0, vel(), s);
    });
    const end = (e) => {
      if (!s || e.pointerId !== s.id) return;
      clearTimeout(s.timer);
      const was = s; s = null;
      if (was.live && up) { const t = performance.now(); const last = was.pts[was.pts.length - 1]; const v = t - last.t > 60 ? { vx:0, vy:0 } : (() => { const a = was.pts[0], b = last; const dt = b.t - a.t || 1; return { vx:(b.x - a.x) / dt, vy:(b.y - a.y) / dt }; })(); up(e, e.clientX - was.x0, e.clientY - was.y0, v, was); }
    };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  };

  return {
    reduce, PRESET, Spring, EASE, CSS, tween, seq, drag,
    FLICK:0.11,                                                   // 甩动：px/ms
    rubber:(x, d) => (x * d * 0.55) / (d + 0.55 * Math.abs(x)),    // 越界阻尼
    project:(x, vPerS, r = 0.998) => x + (vPerS / 1000) * r / (1 - r),   // 动量落点
    clamp:(v, a, b) => Math.min(Math.max(v, a), b),
    sleep:(ms) => new Promise((r) => setTimeout(r, ms)),
    css(text) { const s = document.createElement('style'); s.textContent = text; document.head.append(s); },
    icon:(name, cls = 'ic') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`,
    sections:[],
  };
})();
</script>
<script src="gallery/motion-1.js"></script>
<script src="gallery/motion-2.js"></script>
<script src="gallery/static.js"></script>
<script>
(() => {
  const main = document.getElementById('main'), jump = document.getElementById('jump');
  let motionN = 0, staticN = 0;
  const players = new Map(), pending = [];

  const card = (it, kind) => {
    const el = document.createElement('article');
    el.className = 'item'; el.id = it.code;
    el.innerHTML = `<div class="stage"></div><div class="meta"><div class="name"><a class="code" href="#${it.code}">${it.code}</a><h3>${it.name}</h3></div><p>${it.use}</p>${kind === 'motion'
      ? `<div class="acts"><button class="play" type="button">${GL.icon('play', '')}播放</button>${it.hint ? `<span class="hint">${it.hint}</span>` : ''}</div>` : ''}</div>`;
    return el;
  };
  /* 挂进页面之后再初始化，小样才量得到尺寸 */
  const start = (el, it, kind) => {
    const stage = el.querySelector('.stage');
    if (kind === 'motion') {
      motionN++;
      let api = {};
      try { api = it.mount(stage) || {}; } catch (err) { console.error(it.code, err); stage.textContent = '这个小样没加载出来'; }
      players.set(el, api);
      el.querySelector('.play').addEventListener('click', () => api.play && api.play(false));
      if (GL.reduce.matches && api.final) api.final();
    } else {
      staticN++;
      stage.innerHTML = it.html;
      stage.setAttribute('role', 'img'); stage.setAttribute('aria-label', `${it.code} ${it.name} 示意图`);
    }
  };

  GL.sections.forEach((sec) => {
    const s = document.createElement('section');
    s.className = 'grp'; s.id = sec.id;
    s.innerHTML = `<header><h2>${sec.title}</h2>${sec.note ? `<p class="note">${sec.note}</p>` : ''}</header>`;
    (sec.subs || [{ items:sec.items }]).forEach((sub, si) => {
      const box = document.createElement('div'); box.className = 'sub'; box.id = `${sec.id}-${si + 1}`;
      if (sub.title) box.innerHTML = `<h3>${sub.title}</h3>`;
      const a = document.createElement('a'); a.href = '#' + box.id; a.textContent = sub.title.replace(/ [A-Z]\d.*$| \d+ 套$/, ''); jump.append(a);
      const grid = document.createElement('div'); grid.className = 'grid';
      box.append(grid); s.append(box);
      sub.items.forEach((it) => { const el = card(it, sec.kind); grid.append(el); pending.push([el, it, sec.kind]); });
    });
    main.append(s);
  });
  pending.forEach(([el, it, kind]) => start(el, it, kind));
  document.getElementById('count').textContent = `${motionN} 个会动的配方 · ${staticN} 张静态图`;

  /* 第一次看到时自己播一次；开了「减少动态效果」就不自己播 */
  const io = new IntersectionObserver((list) => list.forEach((en) => {
    if (!en.isIntersecting) return;
    io.unobserve(en.target);
    const api = players.get(en.target);
    if (api && api.play && !GL.reduce.matches) setTimeout(() => api.play(true), 250);
  }), { threshold:0.6 });
  players.forEach((_, el) => io.observe(el));

  /* #编号 跳到那一格并圈出来 */
  const hit = () => {
    document.querySelectorAll('.item.hit').forEach((x) => x.classList.remove('hit'));
    const id = decodeURIComponent(location.hash.slice(1));
    const el = id && document.getElementById(id);
    if (el && el.classList.contains('item')) { el.classList.add('hit'); el.scrollIntoView({ block:'center' }); }
  };
  addEventListener('hashchange', hit);
  if (location.hash) requestAnimationFrame(hit);
})();
</script>
</body>
</html>
